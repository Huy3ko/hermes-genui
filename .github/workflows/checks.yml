name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests
        run: uv run --no-project -q --with pytest --with httpx --with fastapi pytest -c tests/pytest.ini --rootdir=tests tests
      - name: Lint
        run: uvx ruff check --select E,F,W,UP,PTH --line-length 120 --exclude web .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Types
        run: npx tsc --noEmit -p .
      - name: The shipped bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- ../desktop/plugin.js || {
            echo "desktop/plugin.js is out of date: run 'cd web && npm run build' and commit it."; exit 1; }
