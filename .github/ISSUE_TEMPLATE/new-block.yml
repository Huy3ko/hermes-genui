name: New block type (proposal)
description: Propose a new kind of block before writing code
labels: [new-block]
body:
  - type: markdown
    attributes:
      value: >-
        Every block type adds text to the model's guide, which every user pays for on every message, so new blocks
        are agreed here first. Show why existing blocks can't do it.
  - type: textarea
    id: why
    attributes:
      label: What can't be shown today?
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: The JSON the model would write
      description: Keep it small and forgiving. The model fills it in, so fewer fields beat more options.
      render: json
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: How it reads as text (Telegram, CLI)
    validations:
      required: true
