name: Idea or recipe
description: A new recipe, an improvement to a block, or a new data tool
labels: [idea]
body:
  - type: textarea
    id: ask
    attributes:
      label: What would a user ask, and what should they see?
      placeholder: "'How's my SIP doing?' → my funds' value over time, with a what-if slider"
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: Which existing blocks would it use?
      description: Most ideas need only a recipe (no code). Say if you think a new block type is needed.
